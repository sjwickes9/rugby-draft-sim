<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugby World Cup Draft Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Rugby World Cup <span>Draft XV</span></h1>
        <div class="utility-controls">
            <button id="theme-toggle">Light Mode</button>
            <button class="abort-reset-btn">Reset App</button>
        </div>
    </header>

    <main>
        <div id="setup-card" class="card-container">
            <div class="setup-title">
                <h2>Tournament Setup</h2>
                <p>Configure your drafting regulations</p>
            </div>
            
            <div class="control-group">
                <label>Difficulty (Respins Allowed)</label>
                <div class="radio-options">
                    <div class="radio-box">
                        <input type="radio" name="difficulty" value="easy" id="diff-easy">
                        <label for="diff-easy" class="radio-label">Easy (3)</label>
                    </div>
                    <div class="radio-box">
                        <input type="radio" name="difficulty" value="normal" id="diff-normal" checked>
                        <label for="diff-normal" class="radio-label">Normal (1)</label>
                    </div>
                    <div class="radio-box">
                        <input type="radio" name="difficulty" value="hard" id="diff-hard">
                        <label for="diff-hard" class="radio-label">Hard (0)</label>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Gameplay Mode</label>
                <div id="variant-slider-track" class="slider-track">
                    <div id="variant-handle" class="slider-handle"></div>
                    <div class="slider-options">
                        <div id="variant-comp" class="slider-opt active">Standard</div>
                        <div id="variant-career" class="slider-opt">Career Booster</div>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Rating Visibility</label>
                <div id="rating-slider-track" class="slider-track">
                    <div id="rating-handle" class="slider-handle"></div>
                    <div class="slider-options">
                        <div id="lbl-reveal" class="slider-opt active">Visible</div>
                        <div id="lbl-knowledge" class="slider-opt">Blind Mode</div>
                    </div>
                </div>
            </div>

            <button id="start-game-btn" class="btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">Enter Draft Room</button>
        </div>

        <div id="draft-dashboard" class="dashboard-grid hidden">
            <div class="left-panel">
                <div class="panel-card">
                    <div class="stats-row">
                        <div class="stat-box">
                            <div id="avg-global-ovr" class="stat-val">--</div>
                            <div class="stat-lbl">Global OVR</div>
                        </div>
                        <div class="stat-box">
                            <div id="avg-forward-ovr" class="stat-val">--</div>
                            <div class="stat-lbl">Forwards</div>
                        </div>
                        <div class="stat-box">
                            <div id="avg-back-ovr" class="stat-val">--</div>
                            <div class="stat-lbl">Backs</div>
                        </div>
                    </div>
                </div>

                <div class="panel-card">
                    <div class="action-cluster">
                        <button id="spin-btn" class="btn-primary">Spin Team</button>
                        <button id="respin-btn" class="disabled" disabled>Respin (<span id="respin-count">1</span>)</button>
                    </div>
                    <div class="status-feed-box">
                        <div id="flag-indicator" class="flag-wrapper"></div>
                        <div id="status-text">Click "Spin Team" to open your first international player pool.</div>
                    </div>
                    <div id="spinner-anchor" class="spinner-zone"></div>
                </div>

                <div class="panel-card" style="flex: 1; min-height: 350px;">
                    <div class="roster-scroll-boundary" id="roster-container">
                        </div>
                </div>
            </div>

            <div class="panel-card pitch-card">
                <div class="rugby-pitch-canvas">
                    <div class="pitch-line-marking line-dead-top"></div>
                    <div class="pitch-line-marking line-10m-top"></div>
                    <div class="pitch-line-marking line-22m-top"></div>
                    <div class="pitch-line-marking line-halfway"></div>
                    <div class="pitch-line-marking line-22m-bottom"></div>
                    <div class="pitch-line-marking line-10m-bottom"></div>
                    <div class="pitch-line-marking line-dead-base"></div>

                    <div class="pitch-row-tier">
                        <div class="pitch-circle" data-pos="Loosehead Prop" data-label="1"></div>
                        <div class="pitch-circle" data-pos="Hooker" data-label="2"></div>
                        <div class="pitch-circle" data-pos="Tighthead Prop" data-label="3"></div>
                    </div>

                    <div class="pitch-row-tier">
                        <div class="pitch-circle" data-pos="Lock 4" data-label="4"></div>
                        <div class="pitch-circle" data-pos="Lock 5" data-label="5"></div>
                    </div>

                    <div class="pitch-row
