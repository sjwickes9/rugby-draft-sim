<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugby World Cup Historic Draft Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- GLOBAL HEADER LAYER -->
    <header>
        <h1>Rugby World Cup <span>Historic Draft</span></h1>
        <button id="theme-toggle" class="theme-toggle-btn">Light Mode</button>
    </header>

    <main class="main-container">

        <!-- STAGE 1: INITIALIZATION & SETUP SCREEN -->
        <section id="setup-card" class="config-card">
            <h2>Draft Configuration</h2>
            
            <div class="form-group">
                <label>Gameplay Variant</label>
                <div id="variant-slider-track" class="custom-slider-track">
                    <div id="variant-handle" class="custom-slider-handle"></div>
                    <div id="variant-comp" class="slider-option active">Classic</div>
                    <div id="variant-career" class="slider-option">Career (+3)</div>
                </div>
            </div>

            <div class="form-group">
                <label>Rating Visibility Mode</label>
                <div id="rating-slider-track" class="custom-slider-track">
                    <div id="rating-handle" class="custom-slider-handle"></div>
                    <div id="lbl-reveal" class="slider-option active">Reveal OVR</div>
                    <div id="lbl-knowledge" class="slider-option">Hidden (Blind)</div>
                </div>
            </div>

            <div class="form-group">
                <label>Draft Difficulty Level</label>
                <div class="radio-matrix">
                    <label class="radio-box">
                        <input type="radio" name="difficulty" value="easy" checked>
                        <div class="radio-tile">
                            <span class="tile-title">Easy</span>
                            <span class="tile-desc">3 Respins</span>
                        </div>
                    </label>
                    <label class="radio-box">
                        <input type="radio" name="difficulty" value="normal">
                        <div class="radio-tile">
                            <span class="tile-title">Normal</span>
                            <span class="tile-desc">1 Respin</span>
                        </div>
                    </label>
                    <label class="radio-box">
                        <input type="radio" name="difficulty" value="hard">
                        <div class="radio-tile">
                            <span class="tile-title">Hard</span>
                            <span class="tile-desc">0 Respins</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Replace Opponent Spot</label>
                <select id="replace-team-select">
                    <option value="South Africa">South Africa</option>
                    <option value="New Zealand">New Zealand</option>
                    <option value="France">France</option>
                    <option value="Australia">Australia</option>
                </select>
            </div>

            <!-- Standard normal sized initialization button -->
            <button id="start-game-btn" class="action-btn">Initialize Draft Bucket</button>
        </section>


        <!-- STAGE 2: ACTIVE DRAFTING & SQUAD PLACEMENT INTERFACE -->
        <section id="draft-dashboard" class="dashboard-grid hidden">
            
            <!-- LEFT COMPONENT: PITCH GRAPHICS LAYER & LIVE AGGREGATES -->
            <div class="pitch-container">
                
                <!-- Real-Time Sub-Aggregate Performance Display -->
                <div class="live-dashboard-stats">
                    <div class="stat-box">
                        <div class="stat-lbl">Squad Avg</div>
                        <div id="avg-global-ovr" class="stat-val">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-lbl">Forwards</div>
                        <div id="avg-forward-ovr" class="stat-val">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-lbl">Backs</div>
                        <div id="avg-back-ovr" class="stat-val">--</div>
                    </div>
                </div>

                <!-- Lined Playing Surface Field Layout -->
                <div class="rugby-pitch">
                    <div class="pitch-line-half"></div>
                    <div class="pitch-line-22m-top"></div>
                    <div class="pitch-line-22m-bot"></div>

                    <!-- Row 1: Front Row Pack -->
                    <div class="pitch-row">
                        <div class="pitch-circle" data-pos="Loosehead Prop"></div>
                        <div class="pitch-circle" data-pos="Hooker"></div>
                        <div class="pitch-circle" data-pos="Tighthead Prop"></div>
                    </div>

                    <!-- Row 2: Locks -->
                    <div class="pitch-row">
                        <div class="pitch-circle" data-pos="Lock 4"></div>
                        <div class="pitch-circle" data-pos="Lock 5"></div>
                    </div>

                    <!-- Row 3: Loose Forwards Back-Row -->
                    <div class="pitch-row">
                        <div class="pitch-circle" data-pos="Blindside Flanker"></div>
                        <div class="pitch-circle" data-pos="Number 8"></div>
                        <div class="pitch-circle" data-pos="Openside Flanker"></div>
                    </div>

                    <!-- Row 4: Halfback Pivot Pairing -->
                    <div class="pitch-row">
                        <div class="pitch-circle" data-pos="Scrum-half"></div>
                        <div class="pitch-circle" data-pos="Fly-half"></div>
                    </div>

                    <!-- Row 5: Inside & Outside Centres -->
                    <div class="pitch-row">
                        <div class="pitch-circle" data-pos="Inside Centre"></div>
                        <div class="pitch-circle" data-pos="Outside Centre"></div>
                    </div>

                    <!-- Row 6: Deep Back Three Coverage -->
                    <div class="pitch-row">
                        <div class="pitch-circle" data-pos="Left Wing"></div>
                        <div class="pitch-circle" data-pos="Fullback"></div>
                        <div class="pitch-circle" data-pos="Right Wing"></div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COMPONENT: THE CONTROL SIDEBAR -->
            <aside class="control-sidebar">
                
                <!-- Live Telemetry Readout Console -->
                <div class="engine-console">
                    <div class="console-meta">
                        <div id="status-text">Click 'Spin Squad' to generate your first draft selection pool.</div>
                        <div id="flag-indicator"></div>
                    </div>
                    <div id="spinner-anchor"></div>
                </div>

                <!-- Action Execution Panel -->
                <div class="btn-matrix">
                    <button id="spin-btn" class="core-btn spin-action">
                        <span>Spin Squad</span>
                        <span class="sub-lbl">Roll Nation</span>
                    </button>
                    <button id="respin-btn" class="core-btn respin-action disabled" disabled>
                        <span>Respin Pool</span>
                        <span class="sub-lbl"><span id="respin-count">0</span> left</span>
                    </button>
                </div>

                <!-- Scrollable Dynamic Player Roster List -->
                <div id="roster-container" class="scroll-wrapper-box locked">
                    <!-- JavaScript dynamically injects current selection batches here -->
                </div>

                <!-- Universal Abort & Emergency Reset System -->
                <div class="dashboard-footer-ctrls">
                    <button class="abort-reset-btn">Restart Draft</button>
                </div>
            </aside>
        </section>


        <!-- STAGE 3: ISOLATED LIVE TOURNAMENT LOG ENGINE -->
        <section id="sim-dashboard" class="tournament-panel hidden">
            <h2>Tournament Simulator</h2>
            <button id="run-sim-btn" class="success-btn">Kick Off Tournament</button>
            
            <!-- Dedicated Multi-Line Linear Stream Output -->
            <div id="sim-results" class="terminal-stream">
                <!-- Matches automatically write on fresh independent lines here -->
            </div>

            <button id="restart-btn" class="action-btn hidden" style="margin-top: 16px;">Return to Main Menu</button>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
